org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Timeouts curtos de propósito. Por omissão o Gradle espera indefinidamente
# por uma ligação HTTP, e numa rede que deixa ligações mortas (em vez de as
# fechar) o build fica pendurado horas sem falhar nem progredir. Com 30s,
# uma ligação morta cai depressa e o Gradle repete — que é o que resolve.
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000
